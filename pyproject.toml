[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-speech"
version = "0.2.0"
description = "Universal TTS CLI and library — gTTS, espeak/pyttsx3, Piper, Silero, Coqui, Bark behind a single interface."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "wachawo" },
]
keywords = ["tts", "text-to-speech", "speech-synthesis", "gtts", "piper", "silero", "coqui", "bark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "gtts==2.3.0",
    "pyttsx3==2.90",
    "pygame==2.5.2",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    # Microphone recording for `ttsrec` (used to capture xtts_v2 voice samples)
    "sounddevice",
    "numpy",
]

[project.optional-dependencies]
piper = [
    "piper-tts",
]
silero = [
    "torch>=2.0",
    "torchaudio",
    "omegaconf",
]
coqui = [
    # Community fork from Idiap (original Coqui project shut down in Jan 2024).
    # Distribution name `coqui-tts`, import name `TTS` — API-compatible with
    # the abandoned upstream. Supports Python 3.9+ including 3.12.
    # `[codec]` extra pulls torchcodec — required by coqui-tts under PyTorch 2.9+.
    "coqui-tts[codec]",
    "torch>=2.0",
    # `TTS.tts.models.xtts` does `import torchaudio` at module load.
    "torchaudio",
    # transformers 5.x removed `isin_mps_friendly`; coqui-tts < 0.28 still imports it.
    "transformers>=4.46,<5.0",
]
bark = [
    "bark @ git+https://github.com/suno-ai/bark.git",
    "scipy",
    "numpy",
]
api = [
    "Flask==2.3.3",
    "flask-cors==4.0.0",
    "marshmallow==3.20.1",
    "gunicorn==21.2.0",
    "uvicorn==0.23.2",
    "asgiref==3.7.2",
    "pytz>=2023.3",
]
dev = [
    "black==23.3.0",
    "ruff>=0.5",
    "pre-commit>=3.5",
    "mypy==1.4.1",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "types-requests==2.28.11.0",
    "types-PyYAML==6.0.12.0",
]
all = [
    "text-to-speech[piper,silero,api]",
]

[project.urls]
Homepage      = "https://github.com/wachawo/text-to-speech"
Repository    = "https://github.com/wachawo/text-to-speech"
Issues        = "https://github.com/wachawo/text-to-speech/issues"
Documentation = "https://github.com/wachawo/text-to-speech/tree/main/docs"

[project.scripts]
ttsgen  = "ttsgen:main"
ttsplay = "ttsplay:main"
ttsrec  = "ttsrec:main"

[tool.setuptools]
py-modules = ["ttsgen", "ttsplay", "ttsrec"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["libs*", "engines*", "install*"]
exclude = ["api*", "audio*", "samples*", "bin*", "docs*", ".backup*", "tests*"]

[tool.setuptools.package-data]
"*" = ["*.md"]

[tool.black]
line-length    = 128
target-version = ["py311"]
extend-exclude = '''
/(
  \.backup
  | \.venv
  | audio
  | samples
  | engines
  | libs
  | models
)/
'''

[tool.ruff]
line-length = 128
target-version = "py312"
extend-exclude = ["libs", "engines", "models", ".venv", ".backup", "audio", "samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 — handled by black; UP009 — project style requires `# -*- coding: utf-8 -*-`;
# E203/E266/W503 — historic flake8 ignores carried over.
ignore = ["E501", "UP009", "E203", "E266"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q"

[tool.mypy]
python_version       = "3.11"
warn_return_any      = true
warn_unused_configs  = true
disallow_untyped_defs = false
follow_imports       = "skip"
