[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-speech"
version = "1.0.6"
description = "Universal TTS CLI and library - gTTS, espeak/pyttsx3, Piper, Silero, Coqui, Bark behind a single interface."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "wachawo" },
]
keywords = ["tts", "text-to-speech", "speech-synthesis", "gtts", "piper", "silero", "coqui", "bark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "gtts==2.5.4",
    "pyttsx3==2.99",
    "pygame==2.6.1",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    # Microphone recording for `ttsrec` (used to capture xtts_v2 voice samples)
    "sounddevice",
    "numpy",
]

[project.optional-dependencies]
# Engine-specific deps (pipertts / silerotts / coquitts / barktts) are NOT
# exposed as pip extras. The single canonical install path is:
#     ttsgen --install <engine>
# It picks the correct PyTorch wheel index (cpu / cu121), respects driver
# constraints, persists the model directory to ~/.config/ttsgen.conf, and
# downloads voice models with checksum verification where supported.
#
# The base `pip install` ships only gtts + pyttsx3 plus shared infrastructure
# (pygame for playback, requests/dotenv, sounddevice/numpy for ttsrec).
dev = [
    # Lint / format / typecheck / test runner
    "black>=26.5,<27",
    "ruff>=0.14",
    "pre-commit>=4.0",
    "mypy>=2.3,<3",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    # 2.31.0.7+ requires urllib3>=2, but gtts 2.3.0 pins requests~=2.28.0 (urllib3 1.x).
    "types-requests>=2.28,<2.31.0.7",
    # Web stack - needed by tests/ to exercise ttssrv handlers locally.
    # In production ttssrv runs only inside Docker (see docker/{cpu,gpu}/Dockerfile
    # and docker-compose*.yml); these wheels exist in [dev] solely so that
    # `pytest` and ad-hoc `python3 ttssrv/app1.py` work in the dev venv.
    # Exact pins for the Docker image live in ttssrv/requirements.txt - keep
    # the two lists on the same major/minor.
    "Flask>=3.1,<4",
    "flask-cors>=6.0,<7",
    "marshmallow>=3.26,<4",
    "uvicorn>=0.53,<1",
    "pytz>=2026.3",
]

[project.urls]
Homepage      = "https://github.com/wachawo/text-to-speech"
Repository    = "https://github.com/wachawo/text-to-speech"
Issues        = "https://github.com/wachawo/text-to-speech/issues"
Documentation = "https://github.com/wachawo/text-to-speech/tree/main/docs"

[project.scripts]
ttsgen  = "ttsgen:main"
ttsplay = "ttsplay:main"
ttsrec  = "ttsrec:main"
ttsapi  = "ttsapi:main"

[tool.setuptools]
py-modules = ["ttsgen", "ttsplay", "ttsrec", "ttsapi"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["libs*", "engines*", "install*"]
exclude = ["audio*", "samples*", "bin*", "docs*", ".backup*", "tests*", "ttssrv*"]

[tool.black]
line-length    = 128
target-version = ["py311"]
extend-exclude = '''
/(
  \.backup
  | \.venv
  | audio
  | samples
  | models
)/
'''

[tool.ruff]
line-length = 128
target-version = "py311"
extend-exclude = ["models", ".venv", ".backup", "audio", "samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 - handled by black; UP009 - project style requires `# -*- coding: utf-8 -*-`;
# E203/E266/W503 - historic flake8 ignores carried over.
ignore = ["E501", "UP009", "E203", "E266"]
# Project style forbids leading underscores, so deliberately unused names are
# spelled `unused_*`; teach ruff to treat that prefix as a throwaway.
dummy-variable-rgx = "^(_+|unused_[a-zA-Z0-9_]*)$"

[tool.mypy]
ignore_missing_imports = true
files                  = ["libs", "engines", "ttssrv", "ttsgen.py", "ttsapi.py", "ttsplay.py", "ttsrec.py"]

[[tool.mypy.overrides]]
# `logging.basicConfig(**LOGGING)` is the project's logging idiom and the
# `# type: ignore[arg-type]` comments on it predate mypy 2, which reports the
# call as call-overload instead; app1 also rebinds `app.wsgi_app` (method-assign).
module             = ["ttsapi", "ttsrec", "ttssrv.app1"]
disable_error_code = ["call-overload", "method-assign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["libs", "engines", "ttssrv", "ttsgen", "ttsapi", "ttsplay", "ttsrec"]

[tool.coverage.report]
show_missing = true

