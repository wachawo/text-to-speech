name: Feature request
description: Propose a change or an addition.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. A sketch of the command, the API call or the screen is enough.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to get the same result, and why they do not fit.
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      multiple: true
      options:
        - CLI (ttsgen, ttsplay, ttsrec, ttsapi)
        - Python API (libs)
        - HTTP API (ttssrv)
        - Web UI
        - Engine or installer
        - Docs
    validations:
      required: true
