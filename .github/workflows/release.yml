name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that pyproject.toml carries the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$VERSION" != "$TAG" ]; then
            echo "pyproject.toml has version $VERSION, the tag is $TAG" >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install system audio libs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 libportaudio2
      - name: Run the tests on the tagged commit
        run: |
          uv pip install --system -e ".[dev]"
          pytest
      - name: Build wheel and sdist
        run: |
          pip install build==1.6.1
          python -m build
      - name: Extract the CHANGELOG section for this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            /^### \[/ { printing = index($0, "### [" tag "]") == 1 }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No '### [$TAG]' section in CHANGELOG.md" >&2
            exit 1
          fi
          cat release-notes.md
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
