user  nginx;
worker_processes  auto;

# warn, not notice: the error_log line format is hardcoded in nginx and cannot
# be remapped via log_format (which only governs access_log), so the startup
# chatter ("using epoll", "start worker process", ...) can only be silenced by
# raising the level. Anything that matters still comes through at warn.
error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # The screens are .vue files fetched by httpVueLoader over XHR. mime.types
    # has no entry for them, and a second types block adds to the first.
    types {
        text/plain vue;
    }
    sendfile      on;
    keepalive_timeout 65;

    # /etc/nginx/templates/*.template are rendered here by the image entrypoint.
    include       /etc/nginx/conf.d/*.conf;
}
