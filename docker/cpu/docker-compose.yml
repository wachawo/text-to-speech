# CPU-only variant. For GPU use docker/gpu/docker-compose.yml.
# Run from the repo root and pass the root .env explicitly — compose looks for a
# .env next to the compose file (docker/cpu/), NOT here, so ${VAR} interpolation
# (e.g. the published port below) would otherwise fall back to defaults:
#   docker compose --env-file .env -f docker/cpu/docker-compose.yml up -d
# Volume / build paths use ../.. so they resolve to the repo root regardless.

services:
  ttssrv:
    build:
      context: ../..
      dockerfile: docker/cpu/Dockerfile
    image: ttssrv_cpu
    pull_policy: build
    container_name: ttssrv
    hostname: ttssrv
    restart: unless-stopped
    networks:
      - tts_network
    env_file:
      - ../../.env
    environment:
      TZ:                ${TZ:-America/New_York}
      TTS_HOST:          ${TTS_HOST:-0.0.0.0}
      # Container always listens on 5000 (EXPOSE, ports target, and healthcheck
      # below are all fixed to 5000). TTS_PORT from .env controls only the
      # host-published port in the `ports:` mapping, not the in-container bind.
      TTS_PORT:          "5000"
      TTS_DEBUG:         ${TTS_DEBUG:-False}
      TTS_TOKENS:        ${TTS_TOKENS:-}
      CORS_ORIGINS:      ${CORS_ORIGINS:-*}
      TTS_POOL_SIZE:     ${TTS_POOL_SIZE:-1}
      TTS_ENGINE:        ${TTS_ENGINE:-gtts}
      TTS_LANGUAGE:      ${TTS_LANGUAGE:-en}
      COQUITTS_MODELS:   /opt/cache/coquitts
      COQUITTS_MODEL:    ${COQUITTS_MODEL:-tts_models/multilingual/multi-dataset/xtts_v2}
      COQUITTS_SAMPLE:   ${COQUITTS_SAMPLE:-default.wav}
      KOKOROTTS_MODELS:  /opt/cache/kokorotts
      PIPERTTS_MODELS:   /opt/cache/pipertts
      SILEROTTS_MODELS:  /opt/cache/silerotts
      BARKTTS_MODELS:    /opt/cache/barktts
      PYTHONUSERBASE:    /opt/userbase
      PIP_CACHE_DIR:     /opt/pip-cache
    ports:
      - "${TTS_PORT:-5000}:5000"
    volumes:
      - ../../userbase:/opt/userbase
      - ../../pip-cache:/opt/pip-cache
      - ../../cache:/opt/cache
      - ../../samples:/opt/samples:ro
      - ../../.env:/opt/.env:ro
      - ../../libs:/usr/local/lib/python3.12/site-packages/libs:ro
      - ../../engines:/usr/local/lib/python3.12/site-packages/engines:ro
      - ../../install:/usr/local/lib/python3.12/site-packages/install:ro
      - ../../ttssrv:/opt/ttssrv:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  tts_network:
    name: tts_network
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.enable_ipv6: "false"
