services:
  ttssrv:
    build:
      context: .
      dockerfile: docker/gpu/Dockerfile
    image: ttssrv_gpu
    pull_policy: build
    container_name: ttssrv
    hostname: ttssrv
    restart: unless-stopped
    networks:
      - tts_network
    env_file:
      - ./.env
    environment:
      TZ:                         ${TZ:-America/New_York}
      TTS_HOST:                   ${TTS_HOST:-0.0.0.0}
      TTS_PORT:                   ${TTS_PORT:-5000}
      TTS_DEBUG:                  ${TTS_DEBUG:-False}
      TTS_TOKENS:                 ${TTS_TOKENS:-}
      CORS_ORIGINS:               ${CORS_ORIGINS:-*}
      TTS_POOL_SIZE:              ${TTS_POOL_SIZE:-1}
      TTS_ENGINE:                 ${TTS_ENGINE:-gtts}
      TTS_ENGINES:                ${TTS_ENGINES:-}
      TTS_LANGUAGE:               ${TTS_LANGUAGE:-en}
      COQUITTS_MODELS:            /opt/cache/coquitts
      COQUITTS_MODEL:             ${COQUITTS_MODEL:-tts_models/multilingual/multi-dataset/xtts_v2}
      COQUITTS_SAMPLE:            ${COQUITTS_SAMPLE:-default.wav}
      KOKOROTTS_MODELS:           /opt/cache/kokorotts
      PIPERTTS_MODELS:            /opt/cache/pipertts
      SILEROTTS_MODELS:           /opt/cache/silerotts
      BARKTTS_MODELS:             /opt/cache/barktts
      PYTHONUSERBASE:             /opt/data/userbase
      PIP_CACHE_DIR:              /opt/data/pip-cache
      NVIDIA_VISIBLE_DEVICES:     "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    ports:
      - "${TTS_PORT:-5000}:${TTS_PORT:-5000}"
    volumes:
      - ./data:/opt/data
      - ./cache:/opt/cache
      - ./samples:/opt/samples:ro
      - ./.env:/opt/.env:ro
      - ./libs:/opt/libs:ro
      - ./engines:/opt/engines:ro
      - ./install:/opt/install:ro
      - ./ttssrv:/opt/ttssrv:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:${TTS_PORT:-5000}/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # GPU passthrough via CDI. Requires a CDI spec on the host:
    #   sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    # (nvidia-container-toolkit >= 1.14; regenerate after a driver update).
    #
    # Preferred over deploy.resources.reservations.devices: with that form a
    # `systemctl daemon-reload` silently revokes the container's access to the
    # nvidia device nodes on cgroup v2. The container keeps running and looks
    # healthy, but nvidia-smi inside reports "Failed to initialize NVML" and
    # CUDA calls start failing with misleading cuDNN/cuBLAS errors.
    devices:
      - "nvidia.com/gpu=all"

networks:
  tts_network:
    name: tts_network
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.enable_ipv6: "false"
