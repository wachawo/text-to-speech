services:
  tts_api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: tts_api
    pull_policy: build
    container_name: tts_api
    hostname: tts_api
    restart: unless-stopped
    networks:
      - tts_network
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/New_York}
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - ./api:/opt/api
      - ./engines:/opt/engines
      - ./libs:/opt/libs
      - ./.pipertts:/opt/.pipertts
      - ./.silerotts:/opt/.silerotts
      - ./.coquitts:/opt/.coquitts
      - ./samples:/opt/samples:ro
      - .env:/opt/.env:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "python3 /opt/api/app1.py"
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  tts_network:
    name: tts_network
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.enable_ipv6: "false"
