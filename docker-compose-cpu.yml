# CPU-only variant. For GPU use docker-compose.yml (the default).
# Run from the repo root:
#   docker compose -f docker-compose-cpu.yml up -d
# This file lives at the repo root so compose auto-discovers the root .env for
# ${VAR} interpolation (published port, engine, …) with no --env-file flag.

services:
  ttssrv:
    build:
      context: .
      dockerfile: docker/cpu/Dockerfile
    image: ttssrv_cpu
    pull_policy: build
    container_name: ttssrv
    hostname: ttssrv
    restart: unless-stopped
    networks:
      - tts_network
    env_file:
      - ./.env
    environment:
      TZ:                ${TZ:-America/New_York}
      TTS_HOST:          ${TTS_HOST:-0.0.0.0}
      # TTS_PORT drives the bind end-to-end: the app listens on it, and the
      # `ports:` mapping + healthcheck below publish/probe the same port.
      TTS_PORT:          ${TTS_PORT:-5000}
      TTS_DEBUG:         ${TTS_DEBUG:-False}
      TTS_TOKENS:        ${TTS_TOKENS:-}
      CORS_ORIGINS:      ${CORS_ORIGINS:-*}
      TTS_POOL_SIZE:     ${TTS_POOL_SIZE:-1}
      TTS_ENGINE:        ${TTS_ENGINE:-gtts}
      TTS_LANGUAGE:      ${TTS_LANGUAGE:-en}
      COQUITTS_MODELS:   /opt/cache/coquitts
      COQUITTS_MODEL:    ${COQUITTS_MODEL:-tts_models/multilingual/multi-dataset/xtts_v2}
      COQUITTS_SAMPLE:   ${COQUITTS_SAMPLE:-default.wav}
      KOKOROTTS_MODELS:  /opt/cache/kokorotts
      PIPERTTS_MODELS:   /opt/cache/pipertts
      SILEROTTS_MODELS:  /opt/cache/silerotts
      BARKTTS_MODELS:    /opt/cache/barktts
      PYTHONUSERBASE:    /opt/userbase
      PIP_CACHE_DIR:     /opt/pip-cache
    ports:
      - "${TTS_PORT:-5000}:${TTS_PORT:-5000}"
    volumes:
      - ./userbase:/opt/userbase
      - ./pip-cache:/opt/pip-cache
      - ./cache:/opt/cache
      - ./samples:/opt/samples:ro
      - ./.env:/opt/.env:ro
      - ./libs:/usr/local/lib/python3.12/site-packages/libs:ro
      - ./engines:/usr/local/lib/python3.12/site-packages/engines:ro
      - ./install:/usr/local/lib/python3.12/site-packages/install:ro
      - ./ttssrv:/opt/ttssrv:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:${TTS_PORT:-5000}/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

networks:
  tts_network:
    name: tts_network
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.enable_ipv6: "false"
