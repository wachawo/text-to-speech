services:
  ttssrv:
    build:
      context: ./ttssrv
      dockerfile: Dockerfile-cpu     # CPU-only image. For GPU use docker-compose.yml.
    image: ttssrv_cpu
    pull_policy: build
    container_name: ttssrv
    hostname: ttssrv
    restart: unless-stopped
    networks:
      - tts_network
    env_file:
      - .env
    environment:
      TZ:                         ${TZ:-America/New_York}
      TTS_HOST:                   ${TTS_HOST:-0.0.0.0}
      TTS_PORT:                   ${TTS_PORT:-5000}
      TTS_DEBUG:                  ${TTS_DEBUG:-False}
      TTS_TOKEN:                  ${TTS_TOKEN:-}
      TTS_POOL_SIZE:              ${TTS_POOL_SIZE:-1}
      TTS_ENGINE:                 ${TTS_ENGINE:-gtts}
      TTS_LANGUAGE:               ${TTS_LANGUAGE:-en}
      COQUITTS_PATH:              /opt/.coquitts
      COQUITTS_MODEL:             ${COQUITTS_MODEL:-tts_models/multilingual/multi-dataset/xtts_v2}
      COQUITTS_SAMPLE:            /opt/ttsgen.wav
    ports:
      - "${TTS_PORT:-5000}:5000"
    volumes:
      - ./.coquitts:/opt/.coquitts
      - ./samples:/opt/samples:ro
      - ./ttsgen.wav:/opt/ttsgen.wav:ro
      - .env:/opt/.env:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "3"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "python3 /opt/ttssrv/app1.py"
      # - "gunicorn --config /opt/ttssrv/gu.py ttssrv.app1:app"

networks:
  tts_network:
    name: tts_network
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.enable_ipv6: "false"
